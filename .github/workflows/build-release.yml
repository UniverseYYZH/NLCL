name: Build NLMCL release asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build onefile exe
        shell: pwsh
        run: |
          flet pack main.py --name NLMCL --icon "assets/app.ico" --add-data "assets;assets" --product-name "NLMCL" --file-description "NLMCL - lightweight Minecraft Java launcher" --product-version "1.0.0" --file-version "1.0.0.0" --company-name "NLMCL" --copyright "NLMCL" --hidden-import PIL --hidden-import requests --hidden-import urllib3 --hidden-import segno --hidden-import minecraft_launcher_lib -y
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (!(Test-Path "dist/NLMCL.exe")) { throw "dist/NLMCL.exe not found" }
          $hash = (Get-FileHash "dist/NLMCL.exe" -Algorithm SHA256).Hash
          "$hash  NLMCL.exe" | Set-Content "dist/SHA256.txt" -Encoding ascii
          Get-Item "dist/NLMCL.exe" | Select-Object FullName,Length

      - name: Upload release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = gh release view v1.0.0 --json assets --jq ".assets[].name"
          if ($LASTEXITCODE -ne 0) { throw "Release v1.0.0 not found" }
          if ($assets -contains "NLCL.exe") {
            gh release delete-asset v1.0.0 NLCL.exe --yes
          }
          gh release upload v1.0.0 "dist/NLMCL.exe" "dist/SHA256.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Upload failed" }
